services:
  monitora:
    build: .
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/api/health', {signal: AbortSignal.timeout(4000)}).then(response => process.exit(response.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    ports:
      - "127.0.0.1:5173:3000"
    environment:
      MONITORA_DB_PATH: /app/data/monitora.sqlite
      SITE_URL: ${SITE_URL:-https://monitora-timbo.rafaelsoaresce.chatgpt.site}
    volumes:
      - monitora-data:/app/data
volumes:
  monitora-data:
